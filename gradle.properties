android.useAndroidX=true
android.enableJetifier=true
# bcprov-jdk18on 1.85 is a multi-release jar with Java 25 class files (major version 69);
# Jetifier's ASM reader can't parse it, and it has no support-library references to jetify anyway.
android.jetifier.ignorelist=bcprov-jdk18on
android.enableR8.fullMode=false
org.gradle.jvmargs=-XX:MaxMetaspaceSize=512m
android.suppressUnsupportedCompileSdk=34

# Maven Central Publishing Configuration
# These values should be provided by environment variables in CI
# For new Central Portal, use Portal Token instead of username/password
mavenCentralUsername=
mavenCentralPassword=
signing.keyId=
signing.password=
signing.secretKeyRingFile=